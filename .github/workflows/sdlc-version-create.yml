name: "SDLC - Version create"

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  prepare-version:
    name: "Prepare version number"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Extract tag
        id: version
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "Extracted tag: $TAG_NAME"
          echo "version=$TAG_NAME" >> $GITHUB_OUTPUT

  build-push:
    name: "Build & push image"
    runs-on: ubuntu-latest
    needs: [prepare-version]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.uv/bin" >> $GITHUB_PATH

      - name: Set target input
        id: config
        run: |
          version=$(uvx --with hatch-vcs hatchling metadata version)
          COMMIT_SHA=$(git rev-parse "$GITHUB_SHA")
          BUILD_DATE=$(date +"%Y-%m-%d %H:%M")
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT

      - name: Build and push versioned image
        run: |
          IMAGE_TAG="${{ needs.prepare-version.outputs.version }}"
          docker buildx create --use
          docker buildx build \
            --build-arg VERSION="${{ steps.config.outputs.version }}" \
            --build-arg BUILD_DATE="${{ steps.config.outputs.build_date }}" \
            --build-arg SOURCE_COMMIT=${{ steps.config.outputs.commit_sha }} \
            --cache-from unicef/hope-ams:cache-develop \
            --cache-from unicef/hope-ams:cache-$IMAGE_TAG \
            --cache-to unicef/hope-ams:cache-$IMAGE_TAG \
            -t unicef/hope-ams:$IMAGE_TAG \
            -f ./docker/Dockerfile \
            --push \
            ./
