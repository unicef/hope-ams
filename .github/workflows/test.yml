name: Test

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - master
      - staging
      - release/*
      - feature/*
      - bugfix/*
      - hotfix/*

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  id-token: write
  attestations: write


jobs:
  changes:
    if: (github.event_name != 'pull_request'
            || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name)
            || github.event_name == 'create'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    defaults:
      run:
        shell: bash
    outputs:
      run_tests: ${{ steps.changes.outputs.run_tests }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - id: changes
        name: Check for file changes
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.ref }}
          token: ${{ github.token }}
          filters: .github/file-filters.yml

  test:
    needs: [ changes ]
    if: needs.changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 16379:6379
      db:
        image: postgres:14
        env:
          POSTGRES_DATABASE: country_workspace
          POSTGRES_PASSWORD: postgres
          POSTGRES_USERNAME: postgres
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:15432/country_workspace
      CELERY_BROKER_URL: redis://localhost:16379/1
      CACHE_URL: redis://localhost:16379/2
      DOCKER_BUILDKIT: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          version: latest
          enable-cache: true
          prune-cache: false
          cache-local-path: ./uv-cache
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
          python-version: 3.14
          activate-environment: true

      - name: Restore cached vEnv
        id: cache-venv-restore
        uses: actions/cache/restore@v5
        with:
          path: |
            ./uv-cache
            ./tox
          key: ${{ runner.os }}-venv-3.14

      - name: Install dependencies
        run: uv sync --cache-dir ./uv-cache --frozen

      - name: Save vEnv
        id: cache-venv-save
        uses: actions/cache/save@v5
        with:
          path: |
            ./uv-cache
            ./tox
          key: ${{ steps.cache-venv-restore.outputs.cache-primary-key }}

      - name: Run Test suite
        run: |
          uv run tox -e tests

      - name: Archive selenium results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: selenium-log-report
          path: latest_logs
          retention-days: 5

      - name: Upload test results to Codecov
        uses: codecov/test-results-action@v1
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        continue-on-error: false
        with:
          env_vars: OS,PYTHON
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: false
          name: codecov-${{ github.ref_name }}

      - name: build
        id: build
        run: |
            VERSION=$( uvx --with hatch-vcs hatchling metadata version )
            COMMIT_SHA=$(git rev-parse "$GITHUB_SHA")

            uv build --wheel

            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "commit=$COMMIT_SHA" >> $GITHUB_OUTPUT

            echo "::notice title=VERSION:: Build local package $VERSION"
            echo "::notice title=COMMIT:: Build local package $COMMIT_SHA"
