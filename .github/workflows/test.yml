name: "TESTS"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
      db:
        image: postgres:15
        env:
          POSTGRES_DB: ams
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ams
      CELERY_BROKER_URL: redis://localhost:6379/0
      CACHE_URL: redis://localhost:6379/1
      SECRET_KEY: ci-secret-key-for-testing
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - uses: actions/cache/restore@v5
        id: restore-cache
        with:
          path: .venv
          key: ${{ runner.os }}-${{ hashFiles('**/uv.lock') }}

      - name: Install dependencies
        run: uv sync --frozen

      - uses: actions/cache/save@v5
        if: always() && steps.restore-cache.outputs.cache-hit != 'true'
        with:
          path: .venv
          key: ${{ runner.os }}-${{ hashFiles('**/uv.lock') }}

      - name: Run tests
        run: uv run tox -e tests -- pytest tests -q -x --no-migrations --create-db --reuse-db
