target-version = "py314"
line-length = 120
exclude = [
  ".semgrep",
  ".tox",
  ".venv"
]

[lint]
select = [
  "ALL",
]
extend-select = ["UP", ]
ignore = [
  "A005",
  "ARG001",
  "ARG002",
  "ARG005",
  "ANN401",
  "B904",
  "COM812",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D106",
  "D107",
  "D203",
  "D212",
  "D213",
  "DJ001",
  "E731",
  "EM101",
  "EM102",
  "FBT001",
  "FBT002",
  "FBT003",
  "FIX002",
  "I001",
  "ISC001",
  "PLR2004",
  "PLC0415",
  "RUF005",
  "RUF012",
  "SIM108",
  "SLF001",
  "TD003",
  "TID252",
  "TRY400",
  "TRY401",
  "TRY003",
  "UP031",
  "UP035",
  "UP037",
]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[lint.isort]
case-sensitive = true
force-wrap-aliases = true
combine-as-imports = true
extra-standard-library = ["path"]
known-third-party = ['django']
known-first-party = ['hope_ams']
no-sections = false
lines-after-imports = 1
relative-imports-order = "furthest-to-closest"
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder", ]

[lint.per-file-ignores]
".semgrep/**/*.py" = ["ALL"]
"docs/**.py" = ["TC002", "U"]
"tests/**.py" = [
  "ANN",
  "D",
  "INP001",
  "N999",
  "PD901",
  "PGH004",
  "PLR0913",
  "PLR2004",
  "PYI024",
  "S",
  "S101",
  "SIM117",
  "TRY",
  "TRY002",
  "UP",
]
"src/hope_ams/version.py" = ["ALL", ]
"src/**/migrations/**.py" = ["E501", ]
