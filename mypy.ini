[mypy]
python_version = 3.14
files = src/
exclude = (?x)(management/|manage.py|migrations/)
install_types = true
show_error_codes = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/stubs/:$MYPY_CONFIG_FILE_DIR/src/:"
strict = true
ignore_missing_imports = True
namespace_packages = true
plugins =
    mypy_django_plugin.main


[mypy.plugins.django-stubs]
django_settings_module = hope_ams.config.settings

# DRF serializers use metaclass magic that conflicts with strict type-arg checking
[mypy-hope_ams.api.*]
disable_error_code = type-arg
