{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>HOPE AMS</title>
        <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .badge-container {
            text-align: center;
        }
        .badge-container img {
            max-width: 400px;
            height: auto;
            display: block;
        }
        </style>
    </head>
    <body>
        <div class="badge-container">
            <img src="{% static 'web/badge.png' %}" alt="HOPE AMS Badge">
        </div>
    </body>
</html>
