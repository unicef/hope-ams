[tox]
requires =
    tox>=4.2
    tox-uv>=1.20
env_list =
    lint
    mypy
    tests
    pkg_meta
skip_missing_interpreters = true

[testenv]
base_python = python3.14
skip_install = true
deps =
    pip
    uv
pass_env =
    DATABASE_URL
    PYTHONDONTWRITEBYTECODE
    PYTHONPATH
    USER
set_env =
    PYTHONDONTWRITEBYTECODE = true
    PYTHONPATH = {toxinidir}/src
commands =
    {posargs:pytest tests -rw}
allowlist_externals =
    pytest

[testenv:lint]
description = run static analysis and style check using ruff
skip_install = true
deps =
    pre-commit-uv
commands =
    pre-commit run --all-files --show-diff-on-failure

[testenv:mypy]
description = run type check on code base
deps =
    django==5.2.*
commands =
    mypy --config-file mypy.ini {posargs:}
dependency_groups =
    dev
    type-check

[testenv:pkg_meta]
skip_install = true
deps =
    build
    twine
commands =
    uv build --sdist -q --out-dir {env_tmp_dir} .
    uvx twine check {env_tmp_dir}{/}*
    uv pip install --no-binary hope_ams --find-links {env_tmp_dir} hope_ams
