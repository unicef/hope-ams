[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-vcs>=0.4",
  "hatchling>=1.25",
]

[project]
name = "hope-ams"
description = "HOPE Anomaly Management System"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
authors = [
  { name = "sax", email = "s.apostolico@gmail.com" },
]
requires-python = "==3.14.*"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = [
  "celery>=5.4",
  "django<6",
  "django-admin-extra-buttons>=2.2.1",
  "django-adminfilters>=2.7",
  "django-celery-beat>=2.6",
  "django-celery-results>=2.5.1",
  "django-constance[database]>=4.3.5",
  "django-environ>=0.11.2",
  "django-flags>=5",
  "django-smart-env>=0.1",
  "django-strategy-field>=3.2.1",
  "django-unfold>=0.97",
  "djangorestframework>=3.15.1",
  "phonenumbers>=9.0.8",
  "psycopg2-binary>=2.9.9",
  "python-redis-lock[django]>=4",
  "redis",
  "requests>=2.32",
  "sentry-sdk>=2.7.1",
  "social-auth-app-django>=5.4",
  "unicef-security>=1.5",
]
urls.Documentation = "https://unicef.github.io/hope-ams/"
urls.Homepage = "https://github.com/unicef/hope-ams"
urls.Repository = "https://github.com/unicef/hope-ams"

[dependency-groups]
dev = [
  "diff-cover>=9.2",
  "django-regex",
  "django-webtest",
  "factory-boy",
  "freezegun",
  "ipython",
  "mypy",
  "pre-commit",
  "pytest",
  "pytest-celery",
  "pytest-coverage",
  "pytest-django",
  "pytest-factoryboy",
  "pytest-mock",
  "pytest-xdist",
  "requests-mock",
  "responses>=0.26.1",
  "ruff",
  "tox",
]
docs = [
  "zensical",
]
mypy = [
  "boto3-stubs>=1.34.105",
  "djangorestframework-stubs",
  "mypy>=1.9",
  "mypy-boto3>=1.34.105",
  "mypy-boto3-sns>=1.34.44",
  "types-freezegun>=1.1.10",
  "types-markdown>=3.6.0.20240316",
  "types-pyopenssl",
  "types-python-dateutil>=2.9.0.20240316",
  "types-redis>=4.6.0.20240311",
  "types-requests>=2.31.0.20240311",
  "types-s3transfer>=0.10.1",
]
type-check = [
  "django-stubs>=5.1",
  "djangorestframework-stubs>=3.15",
  "types-requests",
]

[tool.hatch]
version.source = "vcs"
version.raw-options.local_scheme = "no-local-version"
build.hooks.vcs.version-file = "src/hope_ams/version.py"
build.targets.wheel.packages = [ "src/hope_ams" ]
build.targets.wheel.ignore-vcs = true
build.targets.sdist.ignore-vcs = true
build.targets.sdist.only-include = [ "src/hope_ams" ]

[tool.uv]
package = true

[tool.django-stubs]
django_settings_module = "hope_ams.config.settings"
